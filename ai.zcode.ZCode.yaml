app-id: ai.zcode.ZCode
branch: stable
# Use the full SDK as the runtime (like Zed/VS Code flatpaks do): it is a
# superset of the Platform and ships the developer toolchain — git, git-lfs,
# python3, gcc, make — that ZCode's built-in git integration and the agent
# rely on, so they work inside the sandbox with no host forwarding.
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: zcode
rename-icon: zcode

# ZCode is a prebuilt Electron app shipped as a .deb. We don't build it from
# source; we unpack the upstream .deb and install the bundled tree into the
# flatpak. The org.freedesktop.Platform runtime provides GTK3, NSS/NSPR, cups,
# alsa, ATK/at-spi and the graphics stack that the bundled Electron links against.
#
# NOTE: do NOT use `inherit-extensions` for org.freedesktop.Platform.GL /
# VulkanLayer here. Doing so copies the extension *definition* into the app's
# metadata, declaring /app/lib/x86_64-linux-gnu/GL as an app-owned extension
# mount point. At runtime flatpak tries to mkdir that path under the read-only
# /app OSTree deployment, which fails with:
#   bwrap: Can't mkdir parents for /app/lib/x86_64-linux-gnu/GL: Read-only file system
#   error: ldconfig failed, exit status 256
# The GL/Vulkan stack is provided transparently by the runtime's own
# org.freedesktop.Platform.GL runtime-level extension (mounted into the
# runtime's /usr, not the app's /app), which is how every Electron app on
# Flathub gets working GPU acceleration.

finish-args:
  # X11 + Wayland rendering
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Network access (talks to z.ai / GLM APIs)
  - --share=network
  # PulseAudio / PipeWire audio
  - --socket=pulseaudio
  # Notifications, secrets (libsecret keyring for credentials) and status notifier
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  # File access: this is a developer tool that edits code, so broad home access is needed.
  - --filesystem=home
  # Host toolchain bridge: read-only mount of the host root at /run/host so
  # ZCode's terminal/agent can run host binaries (git, python, node, ...) via
  # the launcher's SHELL/PATH bridge and the flatpak-spawn wrappers in /app/bin.
  - --filesystem=host-os
  # ZCode can spawn sub-processes; allow talking to the session portal bus.
  - --talk-name=org.freedesktop.Flatpak
  # Own its well-known name (status notifier item / app indicator)
  - --own-name=org.kde.StatusNotifierItem-2-1
  - --own-name=org.kde.StatusNotifierItem.*

modules:
  - name: zcode
    buildsystem: simple
    sources:
      - type: file
        url: https://cdn-zcode.z.ai/zcode/electron/releases/3.7.3/linux-x64/ZCode-3.7.3-linux-x64.deb
        sha256: e9fcca897379d9e976e78b388828f62688a509b2fd9bbd76bc4ad09aba4740d9
        only-arches:
          - x86_64
        dest-filename: ZCode.deb
      - type: file
        path: ai.zcode.ZCode.appdata.xml
      - type: script
        dest-filename: zcode-launcher
        commands:
          # --- Host toolchain bridge -------------------------------------------
          # ZCode's integrated terminal and the agent's bash tool spawn $SHELL,
          # and git is looked up via $ZCODE_GIT_BINARY or $PATH. The host root
          # is mounted read-only at /run/host (--filesystem=host-os); we point
          # those at the host's binaries so the user's real tools work.
          #
          # The host shell must NOT be exec'd directly inside the sandbox: the
          # host glibc (cachyos: 2.42) is newer than the runtime's (~2.41), so
          # the host ELF fails to load with "GLIBC_xx not found". Instead $SHELL
          # points at /app/bin/host-shell, a flatpak-spawn wrapper that runs the
          # host shell in the host namespace (glibc-immune). The host's original
          # $SHELL value is passed along for it; the wrapper falls back to the
          # host passwd entry when the desktop session didn't set $SHELL.
          - |
            if [ -n "$SHELL" ]; then
              export ZCODE_HOST_SHELL="$SHELL"
            fi
            export SHELL=/app/bin/host-shell
          # git: ZCode's built-in git integration uses $ZCODE_GIT_BINARY.
          # Point at the git shipped by the Sdk runtime (glibc-safe, no host
          # forwarding) — immune to the host-PATH pollution from the
          # login-shell env probe.
          - export ZCODE_GIT_BINARY=/usr/bin/git
          # Resolution order: wrappers (/app/bin, host-forwarding) → host
          # /usr/bin → sandbox runtime. Keeps git/node/python3 glibc-safe while
          # still exposing every other host command.
          - export PATH="/app/bin:/run/host/usr/bin:/run/host/bin:$PATH"
          # Electron's bundled chrome-sandbox helper must be setuid-root
          # (mode 4755, owned by root) to work, which is impossible inside a
          # flatpak /app (OSTree forbids setuid binaries there). Since flatpak
          # itself is the sandbox (bubblewrap + seccomp), disable Chromium's
          # inner setuid sandbox. This is the standard approach for flatpaks
          # that wrap a prebuilt Electron binary rather than building against
          # org.electronjs.Electron2.BaseApp + zypak.
          - exec /app/opt/ZCode/zcode --no-sandbox "$@"
    build-commands:
      # Unpack the .deb (an ar archive containing data.tar.*).
      # The data tarball uses root-relative paths (./opt/ZCode, ./usr/share/...).
      - ar -x ZCode.deb
      - mkdir unpacked && tar -xf data.tar.* -C unpacked 2>/dev/null || tar -xf data.tar -C unpacked
      # Install the bundled Electron app tree
      - install -d /app/opt
      - cp -a unpacked/opt/ZCode /app/opt/ZCode
      - chmod -R a+rX /app/opt/ZCode
      # Launcher wrapper on PATH
      - install -Dm755 zcode-launcher /app/bin/zcode
      # Host command wrapper: the general mechanism to forward a command to
      # the host namespace via flatpak-spawn. ZCode's direct dependencies
      # (git/python3 from the Sdk runtime, node embedded in the app) live
      # inside the sandbox and need no forwarding; add a symlink here only for
      # optional host tools: ln -s host-run /app/bin/<cmd>.
      - |
        install -d /app/bin
        cat > /app/bin/host-run <<'EOF'
        #!/bin/sh
        # Run the same-named host command in the host namespace. Absolute paths
        # and shell builtins only: after ZCode's login-shell env probe the
        # sandbox PATH is replaced by the host's, which doesn't contain
        # /usr/bin or /app/bin.
        exec /usr/bin/flatpak-spawn --host "${0##*/}" "$@"
        EOF
        chmod 755 /app/bin/host-run
      # Terminal/agent shell: run the user's host shell in the host namespace.
      # Prefer the host $SHELL value captured by the launcher (ZCODE_HOST_SHELL),
      # fall back to the host passwd entry (the sandbox sees the host passwd),
      # and finally to /bin/bash.
      - |
        cat > /app/bin/host-shell <<'EOF'
        #!/bin/sh
        SHELL_PATH="${ZCODE_HOST_SHELL:-$(/usr/bin/getent passwd "$USER" 2>/dev/null | /usr/bin/cut -d: -f7)}"
        SHELL_PATH="${SHELL_PATH:-/bin/bash}"
        exec /usr/bin/flatpak-spawn --host "$SHELL_PATH" "$@"
        EOF
        chmod 755 /app/bin/host-shell
      # MCP servers / arbitrary host tools: nix lives outside /usr/bin on most
      # setups — NixOS puts it under /run/current-system/sw (which is not even
      # visible inside the sandbox, since host /run isn't mounted by host-os),
      # multi-user Nix under /nix/var/..., Determinate Nix under /nix/var/nix/
      # profiles/default. Probe the common locations from the host side before
      # falling back to a plain PATH lookup.
      - |
        cat > /app/bin/nix <<'EOF'
        #!/bin/sh
        for p in /run/current-system/sw/bin/nix \
                 /etc/profiles/per-user/"$USER"/bin/nix \
                 /nix/var/nix/profiles/default/bin/nix \
                 /nix/var/nix/profiles/per-user/"$USER"/profile/bin/nix \
                 "$HOME/.nix-profile/bin/nix" \
                 /usr/bin/nix /usr/local/bin/nix; do
          if /usr/bin/flatpak-spawn --host test -x "$p" 2>/dev/null; then
            exec /usr/bin/flatpak-spawn --host "$p" "$@"
          fi
        done
        exec /usr/bin/flatpak-spawn --host nix "$@"
        EOF
        chmod 755 /app/bin/nix
      # Icons (flatpak caps app icons at 512x512, so skip 1024)
      - |
        for s in 16 24 32 48 64 128 256 512; do
          src="unpacked/usr/share/icons/hicolor/${s}x${s}/apps/zcode.png"
          if [ -f "$src" ]; then
            install -Dm644 "$src" "/app/share/icons/hicolor/${s}x${s}/apps/zcode.png"
          fi
        done
      # Desktop entry
      - |
        install -d /app/share/applications
        cat > /app/share/applications/ai.zcode.ZCode.desktop <<'EOF'
        [Desktop Entry]
        Type=Application
        Name=ZCode
        Comment=Simple, fast, vibe-ready — the official harness for GLM-5.2
        Comment[zh_CN]=简单、迅捷、氛围十足 — GLM-5.2 官方适配开发工具
        Exec=zcode %U
        Icon=zcode
        Terminal=false
        StartupWMClass=ZCode
        Categories=Development;IDE;Utility;
        MimeType=x-scheme-handler/zcode;
        Keywords=zcode;glm;ai;code;ide;editor;
        EOF
      # AppData / metainfo
      - install -Dm644 ai.zcode.ZCode.appdata.xml /app/share/appdata/ai.zcode.ZCode.appdata.xml
